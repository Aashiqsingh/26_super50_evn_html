<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Form</h1>
<fieldset>
    <legend align="center">Personal Details</legend>
    <form action="thankyou.html" method="post">
        <table>
            <tr>
                <td>Name</td>
                <td><input require placeholder="Enter Name" type="text" name="name" id=""></td>
            </tr>
            <tr>
                <td>Surname</td>
                <td><input type="text" name="sname" id=""></td>
            </tr>
            <tr>
                <td>Age</td>
                <td><input type="number" name="" id=""></td>
            </tr>
            <tr>
                <td>Mobile</td>
                <td><input type="tel" name="" id=""></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="" id=""></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="" id=""></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea rows="10" cols="30" name="" id=""></textarea></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>Male<input type="radio" name="gender" value="male" id="">
                    Female<input  type="radio" name="gender" value="female" id="">
                    Other<input type="radio" name="gender" value="other" id="">
                </td>
            </tr>
            <tr>
                <td>Hobiies</td>
                <td>
                    Cricket <input type="checkbox" name="hobby" value="cricket" id="">
                    Football <input type="checkbox" name="hobby" value="football" id="">
                    Basketball <input type="checkbox" name="hobby" id="" value="basketball">
                </td>
            </tr>
            <tr>
                <td>DOB</td>
                <td><input type="date" name="" id=""></td>
                <!-- <td><input type="time" name="" id=""></td>
                <td><input type="datetime-local" name="" id=""></td>
                <td><input type="month" name="" id=""></td>
                <td><input type="week" name="" id=""></td> -->
            </tr>
            <tr>
                <td>City</td>
                <td>
                    <select name="city" id="">
                        <optgroup label="Gujarat">
                            <option value="" disabled selected>--Select--</option>
                            <option value="ahmedabad">Ahmedabad</option>
                            <option value="surat">Surat</option>
                            <option value="rajkot">Rajkot</option>
                            <option value="bharuch">bharuch</option>
                        </optgroup>
                        <optgroup disabled label="maharastra">
                            <option value="mumbai">Mumbai</option>
                            <option value="pune">Pune</option>
                            <option value="banglore">Bangalore</option>
                            <option value="chennai">Chennai</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Attach file</td>
                <td><input type="file" name="" id=""></td>
            </tr>
            <tr>
                <td><input type="submit" value="submit"></td>
            </tr>
        </table>
    </form>
</fieldset>

</body>
</html>
